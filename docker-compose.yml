services:
  athousandwords:
    build: .
    image: athousandwords:latest
    ports:
      - "8585:8585"  # Unified Gradio GUI + REST API
    volumes:
      - ./user:/app/user  # Persist user config and uploads
      - ./input:/app/input  # Mount input directory
      - ./models:/app/models # Persist Hugging Face cache/models
      - ./src:/app/src
      - ./gui.py:/app/gui.py
      - ./captioner.py:/app/captioner.py
    environment:
      - HF_HOME=/app/models
      # Optional: authenticates to the Hugging Face Hub (needed for gated
      # models; also raises rate limits / download speed). Set HF_TOKEN in a
      # .env file next to this compose file, or in your host environment.
      # Left empty (unauthenticated) if unset.
      - HF_TOKEN=${HF_TOKEN:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    stdin_open: true # Equivalent to -i
    tty: true        # Equivalent to -t
